spring.application.name=franquicias-api

# Local: Docker Compose levanta Mongo y Spring se conecta solo.
# Nube: definir la variable de entorno MONGODB_URI (por ejemplo, la cadena de Atlas).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/franquicias}

# Render (y otras plataformas) indican el puerto en la variable PORT; local: 8080
server.port=${PORT:8080}
