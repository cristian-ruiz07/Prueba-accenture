services:
  mongodb:
    image: mongo:7
    container_name: franquicias-mongo
    environment:
      - MONGO_INITDB_DATABASE=franquicias
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: franquicias-api
    profiles: [ "app" ]
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/franquicias
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/franquicias
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
